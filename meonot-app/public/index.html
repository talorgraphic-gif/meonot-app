<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוח בקרה – תוכנית מתנות למעונות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF8F4;
    --surface:#FFFFFF;
    --cream:#F6EEE1;
    --cream-deep:#EFE2CC;
    --pink:#F5DEE1;
    --pink-deep:#E3AEB6;
    --pink-text:#9C5C64;
    --ink:#2B2825;
    --ink-soft:#847E76;
    --ink-faint:#B4ADA2;
    --line:#EEE6D8;
    --ok:#6F8F63;
    --ok-bg:#E7EEE1;
    --warn:#B87F35;
    --warn-bg:#F5E8D2;
    --danger:#AC5B52;
    --danger-bg:#F3DFDA;
    --danger-deep:#8B3E36;
    --danger-deep-bg:#EFD0CB;
    --radius:20px;
    --radius-sm:12px;
    --shadow: 0 6px 24px rgba(60,50,40,0.07);
    --shadow-sm: 0 2px 10px rgba(60,50,40,0.05);
    --font-display:'Frank Ruhl Libre', serif;
    --font-body:'Heebo', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  body{min-height:100vh;padding-bottom:60px;}
  h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:700;}
  p{margin:0;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);}
  a{color:inherit;}
  ::selection{background:var(--pink-deep);color:#fff;}

  /* ---------- layout ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(251,248,244,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .brand-mark{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pink) 0%, var(--cream) 100%);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow-sm);}
  .brand-text h1{font-size:20px;letter-spacing:0.2px;}
  .brand-text span{font-size:12px;color:var(--ink-soft);}
  .topbar-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

  .breadcrumb{display:flex;align-items:center;gap:8px;padding:14px 0 0;font-size:14px;color:var(--ink-soft);flex-wrap:wrap;}
  .breadcrumb span.sep{color:var(--ink-faint);}
  .breadcrumb a{cursor:pointer;color:var(--ink-soft);}
  .breadcrumb a:hover{color:var(--pink-text);}
  .breadcrumb .current{color:var(--ink);font-weight:600;}

  .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:18px 0 22px;flex-wrap:wrap;}
  .page-head h2{font-size:28px;}
  .page-head .sub{color:var(--ink-soft);font-size:14px;margin-top:4px;}

  /* ---------- buttons ---------- */
  .btn{border:none;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;white-space:nowrap;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{box-shadow:var(--shadow);}
  .btn-accent{background:var(--pink-deep);color:#fff;}
  .btn-accent:hover{box-shadow:var(--shadow);}
  .btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--pink-deep);}
  .btn-danger{background:var(--danger-deep-bg);color:var(--danger-deep);}
  .btn-danger:hover{background:var(--danger-deep);color:#fff;}
  .btn-sm{padding:6px 14px;font-size:12.5px;}
  .btn-icon{width:32px;height:32px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);}
  .btn-icon:hover{border-color:var(--pink-deep);}

  /* ---------- cards ---------- */
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--line);}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
  .stat-card{background:var(--surface);border-radius:var(--radius);padding:18px 20px;border:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .stat-card .label{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .stat-card .value{font-family:var(--font-display);font-size:26px;font-weight:700;}
  .stat-card.accent{background:linear-gradient(135deg, var(--pink) 0%, var(--cream) 120%);}

  .primary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:32px;}
  .primary-card{background:var(--surface);border-radius:var(--radius);padding:22px;border:1px solid var(--line);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .18s ease, box-shadow .18s ease;position:relative;overflow:hidden;}
  .primary-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
  .primary-card::before{content:"";position:absolute;top:-40px;left:-40px;width:110px;height:110px;border-radius:50%;background:var(--pink);opacity:.5;}
  .primary-card .pc-head{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
  .primary-card h3{font-size:21px;}
  .primary-card .pc-tag{font-size:11.5px;color:var(--ink-soft);background:var(--cream);border-radius:999px;padding:3px 10px;}
  .primary-card .pc-stats{display:flex;gap:18px;margin:14px 0 10px;position:relative;z-index:1;}
  .primary-card .pc-stats div span{display:block;}
  .primary-card .pc-stats .n{font-family:var(--font-display);font-size:19px;font-weight:700;}
  .primary-card .pc-stats .l{font-size:11px;color:var(--ink-soft);}
  .primary-card .pc-money{font-size:13px;color:var(--ink-soft);margin-bottom:8px;position:relative;z-index:1;}
  .primary-card .pc-money b{color:var(--ink);}

  .progress-track{height:9px;border-radius:999px;background:var(--cream);overflow:hidden;position:relative;}
  .progress-fill{height:100%;border-radius:999px;transition:width .4s ease;}
  .progress-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-top:6px;}

  /* ---------- badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;white-space:nowrap;}
  .badge-ok{background:var(--ok-bg);color:var(--ok);}
  .badge-warn{background:var(--warn-bg);color:var(--warn);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .badge-danger-deep{background:var(--danger-deep-bg);color:var(--danger-deep);}
  .badge-neutral{background:var(--cream);color:var(--ink-soft);}
  .badge-pink{background:var(--pink);color:var(--pink-text);}

  /* ---------- tables / lists ---------- */
  .manager-list{display:flex;flex-direction:column;gap:10px;margin-bottom:30px;}
  .manager-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px 18px;display:grid;grid-template-columns:1.6fr 1fr 1fr 1.3fr 1fr;gap:14px;align-items:center;cursor:pointer;transition:box-shadow .15s ease, border-color .15s ease;}
  .manager-row:hover{box-shadow:var(--shadow-sm);border-color:var(--pink-deep);}
  .manager-row .mr-name{font-weight:700;font-size:15px;}
  .manager-row .mr-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .manager-row .mr-col-label{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
  .manager-row .mr-col-value{font-size:14px;font-weight:600;}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:34px 0 14px;}
  .section-title h3{font-size:19px;}

  .holiday-table{width:100%;border-collapse:separate;border-spacing:0 10px;}
  .holiday-table thead th{text-align:right;font-size:11.5px;color:var(--ink-soft);font-weight:600;padding:0 14px 6px;text-transform:uppercase;letter-spacing:.02em;}
  .holiday-table tbody tr{background:var(--surface);border:1px solid var(--line);}
  .holiday-table tbody td{padding:14px;font-size:13.5px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .holiday-table tbody td:first-child{border-right:1px solid var(--line);border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
  .holiday-table tbody td:last-child{border-left:1px solid var(--line);border-radius:var(--radius-sm) 0 0 var(--radius-sm);}
  .ht-holiday{font-weight:700;display:flex;align-items:center;gap:8px;}
  .ht-product{color:var(--ink-soft);font-size:12.5px;}
  .ht-product b{color:var(--ink);font-weight:600;display:block;font-size:13.5px;}
  .ht-planned-note{font-size:11px;color:var(--ink-faint);margin-top:3px;}

  .activity-list{display:flex;flex-direction:column;gap:10px;}
  .activity-item{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;}
  .activity-dot{width:8px;height:8px;border-radius:50%;background:var(--pink-deep);margin-top:5px;flex-shrink:0;}
  .activity-time{color:var(--ink-faint);font-size:11.5px;white-space:nowrap;}

  /* ---------- kindergarten detail ---------- */
  .kg-head{background:linear-gradient(135deg, var(--cream) 0%, var(--pink) 130%);border-radius:var(--radius);padding:26px 28px;margin-bottom:26px;border:1px solid var(--line);}
  .kg-head-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;}
  .kg-head h2{font-size:26px;}
  .kg-head .kg-meta{color:var(--ink-soft);font-size:13.5px;margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;}
  .kg-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px;}
  .kg-stat{background:rgba(255,255,255,0.6);border-radius:14px;padding:12px 16px;}
  .kg-stat .l{font-size:11.5px;color:var(--ink-soft);}
  .kg-stat .v{font-family:var(--font-display);font-size:20px;font-weight:700;margin-top:2px;}

  .filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center;}
  .filter-bar input, .filter-bar select{border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;background:var(--surface);color:var(--ink);outline:none;}
  .filter-bar input:focus, .filter-bar select:focus{border-color:var(--pink-deep);}
  .filter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .filter-grid input, .filter-grid select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;background:var(--surface);outline:none;}
  .filter-grid input:focus, .filter-grid select:focus{border-color:var(--pink-deep);}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty-state .em-icon{font-size:38px;margin-bottom:10px;}

  /* ---------- modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(43,40,37,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(2px);}
  .modal{background:var(--surface);border-radius:var(--radius);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
  .modal h3{font-size:20px;margin-bottom:4px;}
  .modal .modal-sub{color:var(--ink-soft);font-size:13px;margin-bottom:18px;}
  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .form-group input, .form-group select, .form-group textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:14px;outline:none;background:var(--bg);color:var(--ink);}
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus{border-color:var(--pink-deep);background:var(--surface);}
  .form-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

  /* ---------- production summary ---------- */
  .prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:26px;}
  .prod-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;}
  .prod-card .p-name{font-size:13px;color:var(--ink-soft);margin-bottom:6px;min-height:34px;}
  .prod-card .p-count{font-family:var(--font-display);font-size:26px;font-weight:700;}
  .prod-card .p-unit{font-size:11.5px;color:var(--ink-faint);}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
  .tab{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);cursor:pointer;color:var(--ink-soft);}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .kg-stats{grid-template-columns:repeat(2,1fr);}
    .manager-row{grid-template-columns:1fr 1fr;row-gap:10px;}
    .filter-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:560px){
    .stat-grid{grid-template-columns:1fr 1fr;}
    .manager-row{grid-template-columns:1fr;}
    .form-row2{grid-template-columns:1fr;}
    .filter-grid{grid-template-columns:1fr;}
    .kg-stats{grid-template-columns:1fr 1fr;}
    .prod-grid{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand" onclick="App.goDashboard()">
      <div class="brand-mark">🎁</div>
      <div class="brand-text">
        <h1>תוכנית מתנות למעונות</h1>
        <span>ניהול שנתי · תקציב · הזמנות</span>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="saveStatus" style="font-size:12px;color:var(--ok);opacity:0;transition:opacity .3s ease;">✓ נשמר</span>
      <button class="btn btn-ghost btn-sm" onclick="App.goSearch()">🔍 חיפוש מתקדם</button>
      <button class="btn btn-primary btn-sm" onclick="App.openAddPrimaryModal()">+ מנהלת ראשית</button>
    </div>
  </div>
</div>
<div class="wrap">
  <div id="breadcrumb"></div>
  <div id="app"></div>
</div>
<div id="modalRoot"></div>

<script>
/* =========================================================================
   DATA DEFINITIONS
   ========================================================================= */
const HOLIDAYS = [
  {key:'rosh',       name:'ראש השנה',    icon:'🍯'},
  {key:'hanuka',      name:'חנוכה',       icon:'🕎'},
  {key:'tuBshvat',    name:'ט"ו בשבט',    icon:'🌳'},
  {key:'purim',       name:'פורים',       icon:'🎭'},
  {key:'pesach',      name:'פסח',         icon:'🌿'},
  {key:'lagBaomer',   name:'ל"ג בעומר',   icon:'🏹'},
  {key:'shavuot',     name:'שבועות',      icon:'🌾'},
  {key:'endOfYear',   name:'סוף שנה',     icon:'🎓'}
];
const HOLIDAY_MAP = Object.fromEntries(HOLIDAYS.map(h=>[h.key,h]));

const STATUSES = ['טרם נבחר','נבחר','ממתין לאישור','אושר','בהכנה','מוכן','סופק','שולם'];
const LOCKED_STATUSES = ['אושר','בהכנה','מוכן','סופק','שולם'];

const STATUS_META = {
  'טרם נבחר':      {icon:'○', cls:'badge-neutral'},
  'נבחר':          {icon:'✎', cls:'badge-pink'},
  'ממתין לאישור':  {icon:'⏳', cls:'badge-warn'},
  'אושר':          {icon:'✓', cls:'badge-ok'},
  'בהכנה':         {icon:'⚙', cls:'badge-warn'},
  'מוכן':          {icon:'📦', cls:'badge-ok'},
  'סופק':          {icon:'🚚', cls:'badge-ok'},
  'שולם':          {icon:'💳', cls:'badge-ok'}
};

const PRODUCTS = {
  rosh:      ['מארז דבש ותפוח מעוצב','ערכת ברכה לשנה טובה','סט כלי דבש קרמיקה'],
  hanuka:    ['סביבון עץ ושוקולד מעוצב','מנורת חנוכה מיני עם נרות','ערכת סופגניות וקישוט'],
  tuBshvat:  ['שקית פירות יבשים מעוצבת','עציץ מיני עם שילוט אישי','ערכת נטיעה לילד'],
  purim:     ['משלוח מנות אישי מעוצב','קופסת תחפושת מיני וממתקים','קופסת פור מעוצבת'],
  pesach:    ['ערכת קידוש מיני','מפית פסח רקומה בשם הילד','סט כוסות קידוש לילדים'],
  lagBaomer: ['קשת וחץ מעוצבים','פנס ל"ג בעומר אישי','ערכת מדורה מיניאטורית'],
  shavuot:   ['סלסלת פירות מעוצבת','עטיפת ביכורים ופרי','זר פרחים מיני'],
  endOfYear: ['תעודת סיום מעוצבת','מארז מתנת סיום שנה','אלבום זיכרונות מיני']
};

const CITIES = ['טירת כרמל','חיפה','כרמיאל','נשר','קריית ביאליק','זכרון יעקב','עכו','נהריה','יקנעם עילית','קריית טבעון','טבריה','עפולה'];
const KG_NAMES = ['אור','פרחים','נרקיס','דבורה','שמש','כוכבים','ניצן','יסמין','רימון','אשכולית','לוטם','שקד','ורד','חבצלת','אירוס','פנינה','טללים','עדן','בוסתן','גפן'];
const MANAGER_NAMES = ['ענבל','שירה','דנה','מיכל','נועה','אורית','טליה','חני','רותם','קרן','שני','אפרת','גלית','ליאת','אורלי','נטע','מירב','עדי','הדר','סיגל'];

const STORAGE_KEY = 'meonot_gifts_db_v1'; // fallback only, not primary storage anymore

/* =========================================================================
   SEED DATA GENERATION
   ========================================================================= */
function daysAgo(n){
  const d = new Date();
  d.setDate(d.getDate()-n);
  return d.toISOString();
}

function seedGenerate(){
  const primaries = [
    {id:'p1', name:'מורן', notes:'אחראית כוללת על אזור הצפון'},
    {id:'p2', name:'ריקי', notes:''},
    {id:'p3', name:'יעל', notes:'מעדיפה תיאום טלפוני לפני כל חג'}
  ];
  const counts = {p1:8, p2:6, p3:6};
  const managers = [];
  const orders = [];
  let mgrIndex = 0, nameIdx = 0, kgIdx = 0, cityIdx = 0;

  primaries.forEach(p=>{
    const n = counts[p.id];
    for(let i=0;i<n;i++){
      mgrIndex++;
      const id = 'm'+mgrIndex;
      const name = MANAGER_NAMES[nameIdx % MANAGER_NAMES.length]; nameIdx++;
      const kgName = 'מעון ' + KG_NAMES[kgIdx % KG_NAMES.length]; kgIdx++;
      const city = CITIES[cityIdx % CITIES.length]; cityIdx++;
      const children = 22 + ((mgrIndex*7) % 45);
      const budgetPerChild = 160 + ((mgrIndex*13) % 90);

      managers.push({id, primaryId:p.id, name, kgName, city, children, budgetPerChild, notes:''});

      HOLIDAYS.forEach((h, hIdx)=>{
        const orderId = id+'_'+h.key;
        const pool = PRODUCTS[h.key];
        const plannedProduct = pool[(mgrIndex+hIdx) % pool.length];
        const plannedPrice = 25 + ((mgrIndex + hIdx*3) % 40);
        let status;
        if(h.key==='rosh'){
          const statusPool = ['אושר','בהכנה','מוכן','ממתין לאישור','נבחר','אושר','בהכנה','מוכן','סופק','טרם נבחר'];
          status = statusPool[mgrIndex % statusPool.length];
        } else if(h.key==='hanuka'){
          const statusPool = ['טרם נבחר','טרם נבחר','נבחר','טרם נבחר','ממתין לאישור','טרם נבחר'];
          status = statusPool[mgrIndex % statusPool.length];
        } else {
          status = 'טרם נבחר';
        }
        const locked = LOCKED_STATUSES.includes(status);
        const childrenSnapshot = locked ? children : null;
        const actualProduct = locked ? plannedProduct : null;
        const actualPrice = locked ? (plannedPrice + (mgrIndex%2===0 ? 0 : -3)) : null;

        orders.push({
          id:orderId, managerId:id, holidayKey:h.key, custom:false,
          plannedProduct, actualProduct, plannedPrice, actualPrice,
          status, notes:'', childrenSnapshot, locked
        });
      });
    }
  });

  const activity = [
    {id:'a1', text:'מורן / מעון אור – ראש השנה אושר', time:daysAgo(1)},
    {id:'a2', text:'ריקי / מעון פרחים – מספר הילדים עודכן מ-42 ל-45', time:daysAgo(2)},

    {id:'a4', text:'יעל / מעון שמש – סטטוס ראש השנה עודכן ל"מוכן"', time:daysAgo(5)}
  ];

  return {primaries, managers, orders, activity};
}

   ========================================================================= */
let DB = null;
let saveTimer = null;

async function loadDB(){
  try{
    const res = await fetch('/api/data');
    if(res.ok){
      const data = await res.json();
      if(data && data.primaries){ DB = data; return; }
    }
  }catch(e){ console.warn('לא הצלחתי להתחבר לשרת, משתמש בנתוני התחלה', e); }
  DB = seedGenerate();
  saveDB();
}

function saveDB(){
  // sync to localStorage too, as an offline safety net
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    fetch('/api/data', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(DB)
    }).then(()=>flashSaveStatus(true)).catch(e=>{ console.warn('השמירה בשרת נכשלה', e); flashSaveStatus(false); });
  }, 250);
}

function flashSaveStatus(ok){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.textContent = ok ? '✓ נשמר' : '⚠ לא נשמר בשרת';
  el.style.opacity = '1';
  el.style.color = ok ? 'var(--ok)' : 'var(--danger)';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.opacity='0'; }, 1800);
}
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function logActivity(text){
  DB.activity.unshift({id:uid('a'), text, time:new Date().toISOString()});
  DB.activity = DB.activity.slice(0,30);
}

/* =========================================================================
   UTILITIES
   ========================================================================= */
function money(n){
  n = Math.round(n||0);
  return '₪' + n.toLocaleString('he-IL');
}
function pct(n){ return Math.round(n) + '%'; }
function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return 'עכשיו';
  if(mins < 60) return 'לפני ' + mins + ' דק׳';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return 'לפני ' + hrs + ' שעות';
  const days = Math.floor(hrs/24);
  return 'לפני ' + days + ' ימים';
}
function esc(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- computations ---------- */
function getManagersOf(primaryId){ return DB.managers.filter(m=>m.primaryId===primaryId); }
function getOrdersOf(managerId){ return DB.orders.filter(o=>o.managerId===managerId); }
function getManager(id){ return DB.managers.find(m=>m.id===id); }
function getPrimary(id){ return DB.primaries.find(p=>p.id===id); }
function getOrder(id){ return DB.orders.find(o=>o.id===id); }

function orderChildren(order, manager){
  if(order.locked && order.childrenSnapshot!=null) return order.childrenSnapshot;
  return manager.children;
}
function orderTotalPlanned(order, manager){
  return orderChildren(order, manager) * (order.plannedPrice||0);
}
function orderTotalActual(order, manager){
  if(!order.locked) return null;
  const price = order.actualPrice!=null ? order.actualPrice : order.plannedPrice;
  return orderChildren(order, manager) * (price||0);
}
function managerBudgetTotal(m){ return m.children * m.budgetPerChild; }
function managerSpent(m){
  const orders = getOrdersOf(m.id);
  return orders.reduce((sum,o)=>{
    const t = orderTotalActual(o,m);
    return sum + (t||0);
  },0);
}
function managerRemaining(m){ return managerBudgetTotal(m) - managerSpent(m); }
function managerPercent(m){
  const b = managerBudgetTotal(m);
  return b>0 ? (managerSpent(m)/b*100) : 0;
}

function budgetStatusMeta(percent){
  if(percent > 100) return {label:'חריגה', icon:'🔴', cls:'badge-danger-deep'};
  if(percent > 90)  return {label:'תקציב כמעט נגמר', icon:'⛔', cls:'badge-danger'};
  if(percent > 70)  return {label:'תשומת לב', icon:'⚠️', cls:'badge-warn'};
  return {label:'מצב תקין', icon:'✓', cls:'badge-ok'};
}
function progressColor(percent){
  if(percent > 100) return 'var(--danger-deep)';
  if(percent > 90)  return 'var(--danger)';
  if(percent > 70)  return 'var(--warn)';
  return 'var(--ok)';
}

function primaryAggregate(primaryId){
  const mgrs = getManagersOf(primaryId);
  const children = mgrs.reduce((s,m)=>s+m.children,0);
  const budget = mgrs.reduce((s,m)=>s+managerBudgetTotal(m),0);
  const spent = mgrs.reduce((s,m)=>s+managerSpent(m),0);
  return {managerCount:mgrs.length, children, budget, spent, remaining:budget-spent, percent: budget>0?(spent/budget*100):0};
}
function overallAggregate(){
  const children = DB.managers.reduce((s,m)=>s+m.children,0);
  const budget = DB.managers.reduce((s,m)=>s+managerBudgetTotal(m),0);
  const spent = DB.managers.reduce((s,m)=>s+managerSpent(m),0);
  const activeOrders = DB.orders.filter(o=>o.status!=='טרם נבחר').length;
  return {
    primaryCount: DB.primaries.length,
    managerCount: DB.managers.length,
    kgCount: DB.managers.length,
    children, budget, spent, remaining: budget-spent,
    percent: budget>0?(spent/budget*100):0,
    activeOrders
  };
}

      if(s.view==='manager'){
        parts.push(`<a onclick="App.goPrimary('${p.id}')">${esc(p.name)}</a>`);
      } else {
        parts.push(`<span class="current">${esc(p.name)}</span>`);
      }
    }
  }
  if(s.view==='manager'){
    const m = getManager(s.managerId);
    if(m) parts.push(`<span class="current">${esc(m.name)} · ${esc(m.kgName)}</span>`);
  }
  if(s.view==='holiday'){
    parts.push(`<span class="current">החג הקרוב</span>`);
  }
  if(s.view==='search'){
    parts.push(`<span class="current">חיפוש מתקדם</span>`);
  }
  el.innerHTML = parts.length>1 ? `<div class="breadcrumb">${parts.join('<span class="sep">›</span>')}</div>` : '';
}

          <div>
            <div class="mr-col-label">ניצול תקציב</div>
            <div class="progress-track" style="margin-top:4px;"><div class="progress-fill" style="width:${Math.min(percent,100)}%;background:${progressColor(percent)}"></div></div>
            <div class="progress-row"><span>${pct(percent)}</span><span>${money(remaining)} נותר</span></div>

/* =========================================================================
   RENDER: MANAGER / KINDERGARTEN DETAIL
   ========================================================================= */
function renderManager(managerId){
  const m = getManager(managerId);
  if(!m){ App.goDashboard(); return; }
  const budget = managerBudgetTotal(m);
  const spent = managerSpent(m);
  const remaining = budget - spent;
  const percent = managerPercent(m);
  const bs = budgetStatusMeta(percent);
  const orders = getOrdersOf(managerId);
  const standardOrders = HOLIDAYS.map(h=> orders.find(o=>o.holidayKey===h.key) ).filter(Boolean);
  const customOrders = orders.filter(o=>o.custom);

  let html = `
    <div class="kg-head">
      <div class="kg-head-top">
        <div>
          <h2>${esc(m.name)}</h2>
          <div class="kg-meta">
            <span>🏠 ${esc(m.kgName)}</span>
            <span>📍 ${esc(m.city)}</span>
            <span>${esc(getPrimary(m.primaryId)?.name || '')}</span>
          </div>
        </div>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-ghost btn-sm" onclick="App.openEditManagerModal('${m.id}')">✎ עריכת פרטים</button>
          <button class="btn btn-ghost btn-sm" onclick="App.openAddCustomEventModal('${m.id}')">+ הוספת הזמנה</button>
        </div>
      </div>
      <div class="kg-stats">
        <div class="kg-stat"><div class="l">🧒 ילדים נוכחי</div><div class="v">${m.children} <span onclick="App.openEditChildrenModal('${m.id}')" style="font-size:13px;cursor:pointer;color:var(--pink-text);">✎</span></div></div>
        <div class="kg-stat"><div class="l">💰 תקציב לילד</div><div class="v">${money(m.budgetPerChild)}</div></div>
        <div class="kg-stat"><div class="l">📊 תקציב כולל</div><div class="v">${money(budget)}</div></div>
        <div class="kg-stat"><div class="l">💵 נותר</div><div class="v">${money(remaining)}</div></div>
      </div>
      <div style="margin-top:16px;">
        <div class="progress-track"><div class="progress-fill" style="width:${Math.min(percent,100)}%;background:${progressColor(percent)}"></div></div>
        <div class="progress-row"><span>${pct(percent)} נוצל (${money(spent)})</span><span class="badge ${bs.cls}">${bs.icon} ${bs.label}</span></div>
      </div>
      ${m.notes ? `<div style="margin-top:14px;font-size:13px;color:var(--ink-soft);">📝 ${esc(m.notes)}</div>` : ''}
    </div>

    <div class="section-title"><h3>📅 תוכנית שנתית</h3></div>
    <table class="holiday-table">
      <thead><tr>
        <th>אירוע</th><th>בחירה מתוכננת</th><th>בחירה בפועל</th><th>ילדים</th><th>סה״כ</th><th>סטטוס</th><th></th>
      </tr></thead>
      <tbody>
        ${standardOrders.map(o=> renderOrderRow(o, m) ).join('')}
      </tbody>
    </table>
  `;

  if(customOrders.length>0){
    html += `
      <div class="section-title"><h3>✨ אירועים מיוחדים</h3></div>
      <table class="holiday-table">
        <thead><tr>
          <th>אירוע</th><th>בחירה מתוכננת</th><th>בחירה בפועל</th><th>ילדים</th><th>סה״כ</th><th>סטטוס</th><th></th>
        </tr></thead>
        <tbody>
          ${customOrders.map(o=> renderOrderRow(o, m) ).join('')}
        </tbody>
      </table>
    `;
  }

  document.getElementById('app').innerHTML = html;
}

function renderOrderRow(o, m){
  const h = o.custom ? null : HOLIDAY_MAP[o.holidayKey];
  const label = o.custom ? (o.customName||'אירוע') : (h.icon + ' ' + h.name);
  const children = orderChildren(o, m);
  const totalPlanned = orderTotalPlanned(o, m);
  const totalActual = orderTotalActual(o, m);
  const meta = STATUS_META[o.status];
  const total = totalActual!=null ? totalActual : totalPlanned;
  const totalLabel = totalActual!=null ? money(totalActual) : (money(totalPlanned) + ' (צפוי)');
  return `
    <tr onclick="App.openEditOrderModal('${o.id}')" style="cursor:pointer;">
      <td class="ht-holiday">${label}</td>
      <td class="ht-product">${esc(o.plannedProduct)||'—'}</td>
      <td class="ht-product"><b>${o.actualProduct ? esc(o.actualProduct) : '—'}</b>${o.locked?'<div class="ht-planned-note">🔒 כמות נעולה: '+children+' ילדים</div>':''}</td>
      <td>${children}</td>
      <td>${totalLabel}</td>
      <td><span class="badge ${meta.cls}">${meta.icon} ${o.status}</span></td>
      <td><span class="btn-icon" onclick="event.stopPropagation();App.openEditOrderModal('${o.id}')" title="עריכה">✎</span></td>
    </tr>
  `;
}

/* =========================================================================
   RENDER: UPCOMING HOLIDAY SCREEN
   ========================================================================= */
function renderHoliday(holidayKey){
  const h = HOLIDAY_MAP[holidayKey] || HOLIDAYS[0];
  const rows = DB.orders.filter(o=>o.holidayKey===h.key).map(o=>({o, m:getManager(o.managerId)})).filter(x=>x.m);

  // production summary: group by actual||planned product
  const productMap = {};
  rows.forEach(({o,m})=>{
    const name = o.actualProduct || o.plannedProduct || 'לא ידוע';
    const qty = orderChildren(o,m);
    productMap[name] = (productMap[name]||0) + qty;
  });
  const productEntries = Object.entries(productMap).sort((a,b)=>b[1]-a[1]);
  const totalUnits = productEntries.reduce((s,[,q])=>s+q,0);

  let html = `
    <div class="page-head">
      <div><h2>${h.icon} החג הקרוב: ${h.name}</h2><div class="sub">כל ההזמנות מכל הרשתות והמעונות עבור אירוע זה</div></div>
    </div>

    <div class="tabs">
      ${HOLIDAYS.map(x=>`<div class="tab ${x.key===h.key?'active':''}" onclick="App.goHoliday('${x.key}')">${x.icon} ${x.name}</div>`).join('')}
    </div>

    <div class="section-title"><h3>🏭 סיכום ייצור נדרש</h3></div>
    <div class="prod-grid">
      ${productEntries.length ? productEntries.map(([name,qty])=>`
        <div class="prod-card">
          <div class="p-name">${esc(name)}</div>
          <div class="p-count">${qty}</div>
          <div class="p-unit">יחידות</div>
        </div>
      `).join('') : '<div class="empty-state"><p>עדיין אין בחירות לחג זה</p></div>'}
    </div>
    <div style="margin:-10px 0 26px;color:var(--ink-soft);font-size:13.5px;">סה״כ ${totalUnits} יחידות בתכנון עבור ${rows.length} מעונות</div>

    <div class="section-title"><h3>📋 פירוט לפי מעון</h3></div>
    <table class="holiday-table">
      <thead><tr>
        <th>מנהלת ראשית</th><th>מנהלת</th><th>מעון</th><th>ילדים</th><th>מוצר</th><th>סה״כ</th><th>סטטוס</th>
      </tr></thead>
      <tbody>
        ${rows.map(({o,m})=>{
          const p = getPrimary(m.primaryId);
          const meta = STATUS_META[o.status];
          const children = orderChildren(o,m);
          const totalActual = orderTotalActual(o,m);
          const totalPlanned = orderTotalPlanned(o,m);
          const totalLabel = totalActual!=null ? money(totalActual) : money(totalPlanned)+' (צפוי)';
          return `
            <tr onclick="App.goManager('${m.id}')" style="cursor:pointer;">
              <td>${esc(p ? p.name : '—')}</td>
              <td>${esc(m.name)}</td>
              <td>${esc(m.kgName)} · ${esc(m.city)}</td>
              <td>${children}</td>
              <td>${esc(o.actualProduct || o.plannedProduct || '—')}</td>
              <td>${totalLabel}</td>
              <td><span class="badge ${meta.cls}">${meta.icon} ${o.status}</span></td>
            </tr>
          `;
        }).join('') || ''}
      </tbody>
    </table>
  `;
  document.getElementById('app').innerHTML = html;
}

/* =========================================================================
   RENDER: ADVANCED SEARCH
   ========================================================================= */
function renderSearch(){
  const s = App.state.search;
  const allRows = DB.orders.map(o=>({o, m:getManager(o.managerId)})).filter(x=>x.m);

  const filtered = allRows.filter(({o,m})=>{
    const p = getPrimary(m.primaryId);
    if(s.q){
      const hay = [m.name, m.kgName, m.city, p?p.name:'', o.plannedProduct, o.actualProduct].join(' ').toLowerCase();
      if(!hay.includes(s.q.toLowerCase())) return false;
    }
    if(s.primary && m.primaryId !== s.primary) return false;
    if(s.city && m.city !== s.city) return false;
    if(s.holiday && o.holidayKey !== s.holiday) return false;
    if(s.status && o.status !== s.status) return false;
    if(s.budget){
      const percent = managerPercent(m);
      const bs = budgetStatusMeta(percent);
      const key = percent>100?'over':percent>90?'danger':percent>70?'warn':'ok';
      if(key !== s.budget) return false;
    }
    return true;
  });

  const cities = [...new Set(DB.managers.map(m=>m.city))].sort();

  let html = `
    <div class="page-head"><div><h2>חיפוש מתקדם</h2><div class="sub">${filtered.length} תוצאות</div></div></div>

    <div class="filter-grid" style="margin-bottom:12px;">
      <input type="text" placeholder="חיפוש חופשי (שם, מעון, עיר, מוצר...)" value="${esc(s.q)}" oninput="App.updateSearch('q', this.value)">
      <select onchange="App.updateSearch('primary', this.value)">
        <option value="">כל המנהלות הראשיות</option>
        ${DB.primaries.map(p=>`<option value="${p.id}" ${s.primary===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select>
      <select onchange="App.updateSearch('city', this.value)">
        <option value="">כל הערים</option>
        ${cities.map(c=>`<option value="${esc(c)}" ${s.city===c?'selected':''}>${esc(c)}</option>`).join('')}
      </select>
      <select onchange="App.updateSearch('holiday', this.value)">
        <option value="">כל החגים</option>
        ${HOLIDAYS.map(h=>`<option value="${h.key}" ${s.holiday===h.key?'selected':''}>${h.icon} ${h.name}</option>`).join('')}
      </select>
      <select onchange="App.updateSearch('status', this.value)">
        <option value="">כל הסטטוסים</option>
        ${STATUSES.map(st=>`<option value="${st}" ${s.status===st?'selected':''}>${st}</option>`).join('')}
      </select>
      <select onchange="App.updateSearch('budget', this.value)">
        <option value="">כל מצבי התקציב</option>
        <option value="ok" ${s.budget==='ok'?'selected':''}>✓ מצב תקין</option>
        <option value="warn" ${s.budget==='warn'?'selected':''}>⚠️ תשומת לב</option>
        <option value="danger" ${s.budget==='danger'?'selected':''}>⛔ כמעט נגמר</option>
        <option value="over" ${s.budget==='over'?'selected':''}>🔴 חריגה</option>
      </select>
      <button class="btn btn-ghost" onclick="App.clearSearch()">🧹 נקה פילטרים</button>
    </div>

    <table class="holiday-table">
      <thead><tr>
        <th>מנהלת ראשית</th><th>מנהלת</th><th>מעון</th><th>חג</th><th>מוצר</th><th>סטטוס</th><th>סה״כ</th>
      </tr></thead>
      <tbody>
        ${filtered.map(({o,m})=>{
          const p = getPrimary(m.primaryId);
          const h = o.custom ? {icon:'✨', name:o.customName||'אירוע'} : HOLIDAY_MAP[o.holidayKey];
          const meta = STATUS_META[o.status];
          const totalActual = orderTotalActual(o,m);
          const totalPlanned = orderTotalPlanned(o,m);
          const totalLabel = totalActual!=null ? money(totalActual) : money(totalPlanned)+' (צפוי)';
          return `
            <tr onclick="App.goManager('${m.id}')" style="cursor:pointer;">
              <td>${esc(p?p.name:'—')}</td>
              <td>${esc(m.name)}</td>
              <td>${esc(m.kgName)}</td>
              <td>${h.icon} ${esc(h.name)}</td>
              <td>${esc(o.actualProduct || o.plannedProduct || '—')}</td>
              <td><span class="badge ${meta.cls}">${meta.icon} ${o.status}</span></td>
              <td>${totalLabel}</td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
    ${filtered.length===0 ? '<div class="empty-state"><div class="em-icon">🔍</div><p>לא נמצאו תוצאות התואמות את הסינון</p></div>' : ''}
  `;
  document.getElementById('app').innerHTML = html;
}

/* =========================================================================
   MAIN RENDER DISPATCH
   ========================================================================= */
function render(){
  renderBreadcrumb();
  const v = App.state.view;
  if(v==='dashboard') renderDashboard();
  else if(v==='primary') renderPrimary(App.state.primaryId);
  else if(v==='manager') renderManager(App.state.managerId);
  else if(v==='holiday') renderHoliday(App.state.holidayKey);
  else if(v==='search') renderSearch();
  else renderDashboard();
}

/* =========================================================================
   INIT
   ========================================================================= */
init();
async function init(){
  await loadDB();
  render();
}
</script>
